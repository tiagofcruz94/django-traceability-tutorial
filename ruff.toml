# Ruff configuration (formatter and linter). Quotes: the default (double).

# Migrations are generated by Django: never formatted or edited by hand.
extend-exclude = ["*/migrations/*"]

[lint]
# learning/ is study material, with deliberately "wrong" experiments; it is not the application.
# Excluded from lint only: Ctrl+S still formats these files.
exclude = ["learning/*"]
ignore = [
    "RUF012",   # list_display = [...] in the admin and migrations: the Django convention
    "FURB157",  # suggests Decimal(45) over Decimal("45"); project rule: always build from a string
]
